# ==========================================================================
# PRUEBAS AUTOMÁTICAS EN GITHUB (GitHub Actions)
#
# En cada push y en cada Pull Request a master o a la rama larga
# migracion-nextjs (conversión a Next.js), GitHub prepara una
# máquina Ubuntu nueva y corre:
#   1. Las pruebas unitarias (sin base de datos) con Node 24 y Node 26.
#   2. Las 274 pruebas de integración de la API contra un MySQL 8.0 nuevo y
#      vacío (un contenedor que se borra al terminar: nunca toca producción).
#   3. El lint, los tipos de TypeScript, la revisión de migraciones (Drizzle) y el build
#      del proyecto Next.js (web/), con Node 26 como en Vercel.
#   4. Las pruebas de integración de la API en Next.js contra un Postgres 18 nuevo y vacío
#      (solo las secciones ya migradas: ver web/pruebas/api/secciones.mjs).
#   5. Las pruebas E2E con Playwright (web/pruebas/e2e/): publicar, pujar entre dos cuentas,
#      cerrar la subasta y chatear, en un navegador de verdad contra otro Postgres desechable.
# El resultado aparece como ✅ o ❌ junto a cada commit y en el Pull Request.
# Al ser Linux, también detecta nombres de tablas mal escritos (Usuarios ≠ usuarios),
# igual que pasaría en la VM.
# ==========================================================================
name: Pruebas

on:
  push:
    branches: [master, migracion-nextjs]
  pull_request:
    branches: [master, migracion-nextjs]
  workflow_dispatch:   # botón "Run workflow" para correrlas a mano

defaults:
  run:
    working-directory: backend

jobs:
  unidad:
    name: Unitarias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unidad

  api:
    name: Integración de la API (MySQL 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          # Contenedor desechable solo para las pruebas: esta clave no protege nada real
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: entrelazados_pruebas
          MYSQL_USER: entrelazados_pruebas
          MYSQL_PASSWORD: clave_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CLAVE_PRUEBAS: clave_ci
      PRUEBAS_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Pruebas de integración
        run: npm run test:api
      - name: Log del servidor (si algo falló)
        if: failure()
        run: cat /tmp/entrelazados_servidor_pruebas.log || true

  web:
    name: Next.js (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Los tipos se revisan aparte para que un error de TypeScript se vea claro (no dentro del build)
      - run: npm run tipos
      # Las migraciones de Drizzle son coherentes entre sí (no necesita base de datos)
      - run: npm run db:revisar
      # No necesita base de datos: /api/salud se ejecuta en cada request, no en el build
      - run: npm run build

  api-next:
    name: API en Next.js (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18
        env:
          # Contenedor desechable solo para las pruebas: esta clave no protege nada real
          POSTGRES_PASSWORD: clave_ci
          POSTGRES_DB: entrelazados_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PRUEBAS_DATABASE_URL: postgres://postgres:clave_ci@127.0.0.1:5432/entrelazados_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pruebas de la API
        run: npm run test:api
      - name: Log del servidor (si algo falló)
        if: failure()
        run: cat /tmp/entrelazados_next_pruebas.log || true

  e2e:
    name: E2E (Playwright)
    # Fijo en 24.04: Playwright 1.57.0 no soporta la 26.04 de ubuntu-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:18
        env:
          # Contenedor desechable solo para las pruebas: esta clave no protege nada real
          POSTGRES_PASSWORD: clave_ci
          POSTGRES_DB: entrelazados_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PRUEBAS_DATABASE_URL: postgres://postgres:clave_ci@127.0.0.1:5432/entrelazados_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Publicar, pujar entre dos cuentas, cerrar la subasta y chatear (pruebas/e2e/)
      - name: Pruebas E2E
        run: npm run e2e
      - name: Informe y trazas (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-informe
          path: |
            web/pruebas/e2e/informe/
            web/pruebas/e2e/resultados/
          retention-days: 7
