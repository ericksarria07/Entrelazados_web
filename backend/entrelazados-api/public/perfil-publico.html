<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <!-- PERFIL PÚBLICO de un proveedor o emprendedor: perfil-publico.html?id=N
         Se puede ver sin iniciar sesión (es la página que se comparte). Nunca muestra
         correo, teléfono, dirección ni RUC: los datos vienen de GET /api/usuarios/:id/publico. -->
    <script src="sesion.js"></script>
    <script src="tema.js"></script>
    <title>Perfil · EntreLazados</title>
    <meta name="description" content="Perfil público en EntreLazados: publicaciones, calificaciones y reseñas.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,900;1,6..12,400&display=swap" rel="stylesheet">

    <!-- Cabecera, botones, insignias, paginación y pie: los mismos del Mercado -->
    <link rel="stylesheet" href="comun.css">
    <link rel="stylesheet" href="mercado.css">
    <style>
        #app { max-width: 1000px; }

        .tarjeta {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--color-principal);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 22px;
            margin-bottom: 18px;
        }
        .tarjeta h2 {
            font-size: 17px; color: var(--color-secundario);
            display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
        }
        .tarjeta h2 small { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-muted); font-family: var(--font-secundaria); }

        /* CABECERA DEL PERFIL */
        .perfil-cabecera { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
        .perfil-avatar {
            width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
            background: var(--color-principal); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-principal); font-size: 32px; font-weight: 900;
            border: 3px solid var(--bg-card); box-shadow: 0 0 0 2px var(--color-principal);
        }
        .perfil-datos { flex: 1; min-width: 220px; }
        .perfil-datos h1 { font-size: 26px; color: var(--color-secundario); line-height: 1.15; margin-bottom: 4px; }
        .perfil-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .perfil-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-muted); }
        .perfil-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .badge-rol { background: var(--color-principal); color: #fff; }
        .perfil-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .perfil-acciones a, .perfil-acciones button { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .aviso-propio {
            margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: var(--radius-sm);
            background: var(--bg-main); border: 1px dashed var(--border-color); color: var(--text-dark);
        }
        .aviso-propio a { color: var(--color-principal); font-weight: 700; }

        /* NÚMEROS */
        .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .cifra {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 14px 16px; box-shadow: var(--shadow-sm);
        }
        .cifra strong { display: block; font-family: var(--font-principal); font-size: 26px; color: var(--color-terciario); line-height: 1.1; }
        .cifra span { font-size: 12px; color: var(--text-muted); font-weight: 600; }

        .sobre p { font-size: 14px; line-height: 1.6; color: var(--text-dark); white-space: pre-line; }
        .sobre dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin-top: 12px; }
        .sobre dt { color: var(--text-muted); font-weight: 600; }
        .sobre dd { color: var(--text-dark); }

        /* REPUTACIÓN */
        .reputacion { display: grid; grid-template-columns: 170px 1fr; gap: 24px; align-items: center; margin-bottom: 8px; }
        .promedio-grande { text-align: center; }
        .promedio-grande strong { display: block; font-family: var(--font-principal); font-size: 46px; color: var(--color-secundario); line-height: 1; }
        .promedio-grande .estrellas-fijas { color: #c98500; font-size: 18px; letter-spacing: 1px; }
        .promedio-grande span { display: block; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .barras { display: flex; flex-direction: column; gap: 6px; }
        .barra { display: grid; grid-template-columns: 34px 1fr 30px; gap: 8px; align-items: center; font-size: 12px; color: var(--text-muted); }
        .barra-fondo { height: 9px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .barra-relleno { height: 100%; background: #e0a100; border-radius: 6px; }
        .resenas { margin-top: 18px; border-top: 1px solid var(--border-color); }
        .resena { padding: 14px 0; border-bottom: 1px dashed var(--border-color); }
        .resena:last-child { border-bottom: none; }
        .resena-cabeza { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; margin-bottom: 4px; }
        .resena-cabeza strong { color: var(--text-dark); }
        .resena-cabeza time { color: var(--text-muted); font-size: 12px; }
        .resena .estrellas-fijas { color: #c98500; }
        .resena p { font-size: 14px; color: var(--text-dark); line-height: 1.5; }
        .resena p.sin-comentario { color: var(--text-muted); font-style: italic; }

        /* PUBLICACIONES Y SUBASTAS */
        .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
        .mini {
            display: flex; flex-direction: column; text-decoration: none; color: inherit;
            border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden;
            background: var(--bg-card); transition: box-shadow .2s ease, transform .15s ease;
        }
        .mini:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .mini-foto { aspect-ratio: 4 / 3; background: var(--bg-main); display: flex; align-items: center; justify-content: center; color: var(--color-principal); font-size: 38px; }
        .mini-foto img { width: 100%; height: 100%; object-fit: cover; }
        .mini-cuerpo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .mini-cuerpo h3 { font-size: 14px; color: var(--color-secundario); line-height: 1.3; font-family: var(--font-secundaria); font-weight: 700; }
        .mini-precio { font-family: var(--font-principal); font-size: 17px; font-weight: 900; color: var(--color-terciario); margin-top: auto; }
        .mini-precio small { font-family: var(--font-secundaria); font-size: 12px; font-weight: 400; color: var(--text-muted); }
        .mini-nota { font-size: 12px; color: var(--text-muted); }

        .vacio-tarjeta { text-align: center; color: var(--text-muted); padding: 16px; font-size: 14px; }
        .error-perfil { text-align: center; padding: 50px 20px; }
        .error-perfil i { font-size: 46px; color: var(--color-principal); }
        .error-perfil h1 { font-size: 22px; color: var(--color-secundario); margin: 10px 0 6px; }
        .error-perfil p { color: var(--text-muted); margin-bottom: 16px; }
        .cargando { color: #f1e8e3; text-align: center; padding: 40px; }

        @media (max-width: 640px) {
            .reputacion { grid-template-columns: 1fr; gap: 14px; }
            .perfil-avatar { width: 64px; height: 64px; font-size: 24px; }
            .perfil-datos h1 { font-size: 22px; }
            .tarjeta { padding: 16px; }
        }
    </style>
</head>
<body>

    <header class="amazon-header">
        <a href="index.html" class="logo">Entre<span>Lazados</span></a>
        <div style="flex:1"></div>
        <div class="nav-user"><div id="authArea"></div></div>
    </header>

    <nav class="sub-bar" aria-label="Secciones">
        <a href="index.html"><i class="ti ti-home"></i> Inicio</a>
        <a href="mercado.html"><i class="ti ti-building-store"></i> Mercado</a>
        <a href="chat.html" data-solo-sesion><i class="ti ti-message-circle"></i> Chats</a>
        <a href="dashboard.html" data-solo-sesion><i class="ti ti-chart-bar"></i> Dashboard</a>
    </nav>

    <main id="app">
        <p class="cargando" id="cargando" role="status">Cargando perfil…</p>
        <div id="perfil" hidden></div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-brand">NICA<span>RAGUA</span></div>
            <div class="footer-center">
                <p>EntreLazados © 2026 - Plataforma de Comercio de Materia Prima y Calzado</p>
                <p style="margin-top: 8px;">
                    <a href="index.html">Inicio</a> |
                    <a href="mercado.html">Mercado</a> |
                    <a href="perfil.html">Mi Perfil</a>
                </p>
            </div>
            <div class="footer-volcano"><img src="volcan.webp" alt="Volcán Nicaragua"></div>
        </div>
    </footer>

    <script>
        const API_URL = window.location.origin;
        const perfilId = parseInt(new URLSearchParams(window.location.search).get('id'), 10);
        const conSesion = !!localStorage.getItem('token');
        const miId = Number(localStorage.getItem('userId')) || null;
        const POR_PAGINA = { resenas: 5, publicaciones: 6, subastas: 6 };
        let perfil = null;

        const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
        const dinero = (n) => `C$ ${Number(n).toLocaleString('es-NI', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const estrellasFijas = (n) => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
        const fechaCorta = (f) => new Date(f).toLocaleDateString('es-NI', { day: 'numeric', month: 'short', year: 'numeric' });
        const iniciales = (nombre) => String(nombre).trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase() || '?';

        // ------------------------------------------------------------ CABECERA (con o sin sesión)
        function pintarCabecera() {
            const area = document.getElementById('authArea');
            if (!conSesion) {
                document.querySelectorAll('[data-solo-sesion]').forEach(a => a.remove());
                area.innerHTML = `<a href="login.html" class="user-btn-nav" style="text-decoration:none;"><i class="ti ti-login"></i> <span class="user-nav-name">Iniciar sesión</span></a>`;
                return;
            }
            const nombre = localStorage.getItem('userNombre') || 'Usuario';
            const rol = localStorage.getItem('userRol') || '';
            area.innerHTML = `
                <div class="user-dropdown-wrapper">
                    <button class="user-btn-nav" onclick="toggleUserDropdown(event)" aria-haspopup="true" aria-label="Menú de ${esc(nombre)}">
                        <i class="ti ti-user-circle" style="font-size: 22px;"></i>
                        <div class="user-nav-text">
                            <span class="user-nav-name">${esc(nombre)}</span>
                            <span class="user-nav-role">${esc(rol.toUpperCase())}</span>
                        </div>
                        <i class="ti ti-chevron-down" style="font-size: 14px; margin-left: 2px;"></i>
                    </button>
                    <div class="dropdown-menu-nav" id="userDropdownMenu">
                        <a href="perfil.html" class="dropdown-item-nav"><i class="ti ti-id" style="font-size: 18px; color: var(--color-principal);"></i> Ver mi perfil</a>
                        <div class="dropdown-divider-nav"></div>
                        <a href="javascript:void(0)" onclick="cerrarSesion()" class="dropdown-item-nav logout-item"><i class="ti ti-logout" style="font-size: 18px;"></i> Cerrar sesión</a>
                    </div>
                </div>`;
        }

        // ------------------------------------------------------------ PERFIL
        function mostrarError(titulo, texto) {
            document.getElementById('cargando').hidden = true;
            const caja = document.getElementById('perfil');
            caja.hidden = false;
            caja.innerHTML = `
                <section class="tarjeta error-perfil">
                    <i class="ti ti-user-question" aria-hidden="true"></i>
                    <h1>${esc(titulo)}</h1>
                    <p>${esc(texto)}</p>
                    <a href="mercado.html" class="btn-primary" style="text-decoration:none;"><i class="ti ti-building-store"></i> Ir al Mercado</a>
                </section>`;
        }

        async function cargarPerfil() {
            pintarCabecera();
            if (!(perfilId > 0)) return mostrarError('Falta el perfil', 'El enlace no dice de quién es el perfil.');
            try {
                const res = await fetch(`${API_URL}/api/usuarios/${perfilId}/publico`);
                if (res.status === 404) return mostrarError('Perfil no disponible', 'Este perfil no existe o la cuenta ya no está activa.');
                if (!res.ok) throw new Error('sin datos');
                perfil = await res.json();
            } catch (e) {
                return mostrarError('No se pudo cargar el perfil', 'Revisa tu conexión e inténtalo de nuevo.');
            }
            pintarPerfil();
            cargarResenas(1);
            if (perfil.rol === 'Proveedor') {
                cargarPublicaciones(1);
                cargarSubastas(1);
            }
        }

        function pintarPerfil() {
            const p = perfil;
            const esProveedor = p.rol === 'Proveedor';
            const esMio = miId === p.id;
            const subtitulo = esProveedor ? p.nombreComercial : p.marca;
            const r = p.reputacion;
            document.title = `${p.nombre} · EntreLazados`;

            // "Escribirle": sin sesión lleva al login y vuelve al chat con esta persona
            const chat = `chat.html?contacto=${p.id}`;
            const botonChat = esMio ? '' : conSesion
                ? `<a class="btn-primary" href="${chat}"><i class="ti ti-message-circle"></i> Escribirle</a>`
                : `<a class="btn-primary" href="login.html"><i class="ti ti-login"></i> Inicia sesión para escribirle</a>`;
            const botonMercado = esProveedor && p.estadisticas.publicaciones
                ? `<a class="btn-sm" href="mercado.html?proveedor=${p.id}&nombre=${encodeURIComponent(p.nombre)}"><i class="ti ti-building-store"></i> Ver en el Mercado</a>` : '';

            const datosSobre = [
                esProveedor && p.materiaPrincipal ? ['Vende principalmente', p.materiaPrincipal] : null,
                !esProveedor && p.especialidad ? ['Especialidad', p.especialidad] : null,
                p.departamento ? ['Departamento', p.departamento] : null
            ].filter(Boolean);
            const sobre = p.descripcion || datosSobre.length ? `
                <section class="tarjeta sobre" aria-labelledby="titulo-sobre">
                    <h2 id="titulo-sobre"><i class="ti ti-info-circle" style="color:var(--color-principal)"></i> ${esProveedor ? 'Sobre la empresa' : 'Sobre su taller'}</h2>
                    ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
                    ${datosSobre.length ? `<dl>${datosSobre.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
                </section>` : '';

            const maxBarra = Math.max(1, ...Object.values(r.distribucion));
            const barras = [5, 4, 3, 2, 1].map(n => {
                const cant = r.distribucion[n] || 0;
                return `<div class="barra"><span>${n} ★</span>
                    <div class="barra-fondo" role="img" aria-label="${plural(cant, 'calificación', 'calificaciones')} de ${n} estrella${n === 1 ? '' : 's'}"><div class="barra-relleno" style="width:${(cant / maxBarra) * 100}%"></div></div>
                    <span>${cant}</span></div>`;
            }).join('');

            const cifras = [
                esProveedor ? [p.estadisticas.publicaciones, 'Publicaciones'] : null,
                esProveedor ? [p.estadisticas.subastasActivas, 'Subastas activas'] : null,
                [p.estadisticas.tratosCompletados, 'Tratos completados'],
                [r.total ? r.promedio.toFixed(1) + ' ★' : '—', r.total ? plural(r.total, 'calificación', 'calificaciones') : 'Sin calificaciones']
            ].filter(Boolean);

            const caja = document.getElementById('perfil');
            caja.innerHTML = `
                <section class="tarjeta" aria-labelledby="nombre-perfil">
                    <div class="perfil-cabecera">
                        <div class="perfil-avatar" aria-hidden="true">${esc(iniciales(p.nombre))}</div>
                        <div class="perfil-datos">
                            <h1 id="nombre-perfil">${esc(p.nombre)}</h1>
                            ${subtitulo && subtitulo !== p.nombre ? `<div class="perfil-sub">${esc(subtitulo)}</div>` : ''}
                            <div class="perfil-meta">
                                <span class="badge badge-rol"><i class="ti ${esProveedor ? 'ti-truck' : 'ti-shoe'}" aria-hidden="true"></i> ${esc(p.rol)}</span>
                                ${p.departamento ? `<span><i class="ti ti-map-pin" aria-hidden="true"></i> ${esc(p.departamento)}</span>` : ''}
                                <span><i class="ti ti-calendar" aria-hidden="true"></i> En EntreLazados desde ${esc(new Date(p.miembroDesde).toLocaleDateString('es-NI', { month: 'long', year: 'numeric' }))}</span>
                            </div>
                            <div class="perfil-acciones">
                                ${botonChat}
                                ${botonMercado}
                                <button type="button" class="btn-sm" onclick="compartirPerfil(this)"><i class="ti ti-share"></i> Compartir</button>
                            </div>
                            ${esMio ? `<p class="aviso-propio"><i class="ti ti-eye" aria-hidden="true"></i> Así ven tu perfil los demás (no se muestran tu correo ni tu teléfono). <a href="perfil.html">Editar mis datos</a></p>` : ''}
                        </div>
                    </div>
                </section>

                <div class="cifras">${cifras.map(([n, t]) => `<div class="cifra"><strong>${esc(n)}</strong><span>${esc(t)}</span></div>`).join('')}</div>

                ${sobre}

                <section class="tarjeta" aria-labelledby="titulo-resenas">
                    <h2 id="titulo-resenas"><i class="ti ti-star" style="color:#c98500"></i> Calificaciones y reseñas</h2>
                    ${r.total ? `
                        <div class="reputacion">
                            <div class="promedio-grande">
                                <strong>${r.promedio.toFixed(1)}</strong>
                                <div class="estrellas-fijas" aria-label="${r.promedio} de 5 estrellas">${estrellasFijas(r.promedio)}</div>
                                <span>${plural(r.total, 'calificación', 'calificaciones')} en tratos completados</span>
                            </div>
                            <div class="barras">${barras}</div>
                        </div>
                        <div class="resenas" id="lista-resenas" aria-live="polite"></div>
                        <div class="paginacion" id="paginacion-resenas"></div>`
                    : `<p class="vacio-tarjeta">Todavía no tiene calificaciones. Se califican al completar un trato.</p>`}
                </section>

                ${esProveedor ? `
                <section class="tarjeta" aria-labelledby="titulo-publicaciones">
                    <h2 id="titulo-publicaciones"><i class="ti ti-package" style="color:var(--color-principal)"></i> Publicaciones <small id="total-publicaciones"></small></h2>
                    <div class="rejilla" id="lista-publicaciones"></div>
                    <div class="paginacion" id="paginacion-publicaciones"></div>
                </section>
                <section class="tarjeta" aria-labelledby="titulo-subastas" style="border-top-color: var(--color-terciario);">
                    <h2 id="titulo-subastas"><i class="ti ti-gavel" style="color:var(--color-terciario)"></i> Subastas activas <small id="total-subastas"></small></h2>
                    <div class="rejilla" id="lista-subastas"></div>
                    <div class="paginacion" id="paginacion-subastas"></div>
                </section>` : ''}`;
            document.getElementById('cargando').hidden = true;
            caja.hidden = false;
        }

        // ------------------------------------------------------------ PAGINACIÓN
        // "Anterior / Página X de Y / Siguiente" (el servidor responde { datos, total, pagina, paginas })
        function pintarPaginacion(idCaja, datos, funcion) {
            const caja = document.getElementById(idCaja);
            if (!caja) return;
            if (!datos || datos.paginas <= 1) { caja.innerHTML = ''; return; }
            caja.innerHTML = `
                <button class="btn-sm" ${datos.pagina <= 1 ? 'disabled' : ''} onclick="${funcion}(${datos.pagina - 1}, true)"><i class="ti ti-chevron-left"></i> Anterior</button>
                <span>Página <strong>${datos.pagina}</strong> de ${datos.paginas}</span>
                <button class="btn-sm" ${datos.pagina >= datos.paginas ? 'disabled' : ''} onclick="${funcion}(${datos.pagina + 1}, true)">Siguiente <i class="ti ti-chevron-right"></i></button>`;
        }

        // Pide una página y la pinta; con desplazar, lleva la vista al inicio de la sección
        async function cargarSeccion({ url, idLista, idPaginacion, funcion, pintar, vacio, desplazar }) {
            const lista = document.getElementById(idLista);
            if (!lista) return null;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('sin datos');
                const datos = await res.json();
                lista.innerHTML = datos.datos.length ? datos.datos.map(pintar).join('') : `<p class="vacio-tarjeta">${vacio}</p>`;
                pintarPaginacion(idPaginacion, datos, funcion);
                if (desplazar) lista.closest('section').scrollIntoView({ behavior: 'smooth', block: 'start' });
                return datos;
            } catch (e) {
                lista.innerHTML = '<p class="vacio-tarjeta">No se pudo cargar esta sección.</p>';
                return null;
            }
        }

        function cargarResenas(pagina, desplazar = false) {
            return cargarSeccion({
                url: `${API_URL}/api/usuarios/${perfilId}/resenas?pagina=${pagina}&porPagina=${POR_PAGINA.resenas}`,
                idLista: 'lista-resenas', idPaginacion: 'paginacion-resenas', funcion: 'cargarResenas', desplazar,
                vacio: 'Todavía no hay reseñas.',
                pintar: (c) => `
                    <article class="resena">
                        <div class="resena-cabeza">
                            <span><strong>${esc(c.autor)}</strong> · <span class="estrellas-fijas" aria-label="${c.puntuacion} de 5 estrellas">${estrellasFijas(c.puntuacion)}</span></span>
                            <time datetime="${esc(c.fecha)}">${esc(fechaCorta(c.fecha))}</time>
                        </div>
                        ${c.comentario ? `<p>${esc(c.comentario)}</p>` : '<p class="sin-comentario">Calificó sin comentario.</p>'}
                    </article>`
            });
        }

        async function cargarPublicaciones(pagina, desplazar = false) {
            const datos = await cargarSeccion({
                url: `${API_URL}/api/ofertas?proveedorId=${perfilId}&pagina=${pagina}&porPagina=${POR_PAGINA.publicaciones}`,
                idLista: 'lista-publicaciones', idPaginacion: 'paginacion-publicaciones', funcion: 'cargarPublicaciones', desplazar,
                vacio: 'No tiene publicaciones por ahora.',
                pintar: (o) => `
                    <a class="mini" href="mercado.html?oferta=${Number(o.OfertaID)}">
                        <div class="mini-foto">${o.Fotos && o.Fotos.length ? `<img src="${esc(o.Fotos[0])}" alt="${esc(o.TituloMaterial)}" loading="lazy" onerror="fotoRota(this)">` : '<i class="ti ti-package" aria-hidden="true"></i>'}</div>
                        <div class="mini-cuerpo">
                            <span class="mini-nota">${esc(o.NombreCategoria)}</span>
                            <h3>${esc(o.TituloMaterial)}</h3>
                            <div class="mini-precio">${dinero(o.Precio)} <small>${esc(o.UnidadMedida)}</small></div>
                        </div>
                    </a>`
            });
            const total = document.getElementById('total-publicaciones');
            if (total && datos) total.textContent = datos.total ? plural(datos.total, 'publicación', 'publicaciones') : '';
        }

        async function cargarSubastas(pagina, desplazar = false) {
            const datos = await cargarSeccion({
                url: `${API_URL}/api/subastas?proveedorId=${perfilId}&pagina=${pagina}&porPagina=${POR_PAGINA.subastas}`,
                idLista: 'lista-subastas', idPaginacion: 'paginacion-subastas', funcion: 'cargarSubastas', desplazar,
                vacio: 'No tiene subastas abiertas en este momento.',
                pintar: (s) => {
                    const lote = String(s.TituloLote || '').replace(/^Lote Subasta:\s*/i, '') || s.TituloLote;
                    const pujas = Number(s.TotalPujas) || 0;
                    return `
                    <a class="mini" href="mercado.html#tab-auctions">
                        <div class="mini-foto">${s.Foto ? `<img src="${esc(s.Foto)}" alt="${esc(lote)}" loading="lazy" onerror="fotoRota(this)">` : '<i class="ti ti-gavel" aria-hidden="true"></i>'}</div>
                        <div class="mini-cuerpo">
                            <span class="mini-nota">${esc(s.NombreCategoria || 'Subasta')} · ${plural(pujas, 'puja', 'pujas')}</span>
                            <h3>${esc(lote)}</h3>
                            <div class="mini-precio">${dinero(s.PrecioActual)} <small>cierra el ${esc(fechaCorta(s.FechaFin))}</small></div>
                        </div>
                    </a>`;
                }
            });
            const total = document.getElementById('total-subastas');
            if (total && datos) total.textContent = datos.total ? plural(datos.total, 'subasta', 'subastas') : '';
        }

        // Una foto que ya no está en el servidor: se muestra un ícono en su lugar
        function fotoRota(img) {
            const icono = document.createElement('i');
            icono.className = 'ti ti-photo-off';
            icono.setAttribute('aria-hidden', 'true');
            img.replaceWith(icono);
        }

        // ------------------------------------------------------------ COMPARTIR
        // En el celular abre el menú de compartir del sistema; en la computadora copia el enlace
        async function compartirPerfil(boton) {
            const url = `${window.location.origin}${window.location.pathname}?id=${perfilId}`;
            const datos = { title: `${perfil.nombre} en EntreLazados`, text: `Mira el perfil de ${perfil.nombre} en EntreLazados`, url };
            try {
                if (navigator.share) return await navigator.share(datos);
                await navigator.clipboard.writeText(url);
                const original = boton.innerHTML;
                boton.innerHTML = '<i class="ti ti-check"></i> Enlace copiado';
                setTimeout(() => { boton.innerHTML = original; }, 2000);
            } catch (e) {
                if (e && e.name === 'AbortError') return;   // cerró el menú de compartir
                window.prompt('Copia este enlace:', url);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarPerfil);
    </script>
</body>
</html>
