<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <title>Confirmar correo - EntreLazados</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="sesion.js"></script>
    <script src="tema.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Página del enlace que llega por correo al registrarse: verificar.html?token=... -->
    <style>
        :root {
            --color-principal: #7D381B;
            --color-secundario: #3D170A;
            --color-terciario: #993D24;
            --texto-suave: #6b5b53;
            --borde: #d6c7bd;
            --exito: #1e6b2a;
            --error: #a12a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: #f5efe9 url('patron.webp') center / cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--color-secundario);
        }

        .tarjeta {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            border-radius: 8px;
            border-top: 4px solid var(--color-terciario);
            box-shadow: 0 8px 24px rgba(61, 23, 10, 0.18);
        }

        .logo { display: block; height: 56px; margin: 0 auto 16px; }

        .icono-grande {
            display: flex; align-items: center; justify-content: center;
            width: 64px; height: 64px; margin: 0 auto 14px;
            border-radius: 50%; font-size: 32px;
            background: #f5efe9; color: var(--color-principal);
        }
        .icono-grande.exito { background: #e8f5e9; color: var(--exito); }
        .icono-grande.error { background: #fdecea; color: var(--error); }

        h1 { font-size: 22px; text-align: center; margin-bottom: 6px; }
        .subtitulo { font-size: 15px; color: var(--texto-suave); text-align: center; margin-bottom: 22px; line-height: 1.45; }

        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 12px; margin-bottom: 14px;
            font: inherit; color: inherit;
            border: 1px solid var(--borde); border-radius: 4px;
        }
        input:focus { outline: 2px solid var(--color-principal); border-color: transparent; }

        .boton {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px;
            font: inherit; font-weight: 700; color: #fff;
            background: var(--color-principal);
            border: none; border-radius: 4px; cursor: pointer; text-decoration: none;
        }
        .boton:hover { background: var(--color-secundario); }
        .boton:disabled { opacity: 0.6; cursor: not-allowed; }

        .mensaje { display: none; font-size: 14px; padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; line-height: 1.4; }
        .mensaje.error { display: block; background: #fdecea; color: var(--error); }
        .mensaje.exito { display: block; background: #e8f5e9; color: var(--exito); }

        .enlaces { display: flex; justify-content: center; gap: 18px; margin-top: 18px; font-size: 14px; }
        .enlaces a { color: var(--color-principal); font-weight: 600; }

        .vista { display: none; }
        .vista.activa { display: block; }
        .cargando { text-align: center; color: var(--texto-suave); padding: 24px 0; }
        .giro { display: inline-block; animation: girar 1s linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }

        @media (max-width: 420px) {
            .tarjeta { padding: 26px 18px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <main class="tarjeta">
        <img class="logo" src="logo.png" alt="EntreLazados">

        <section id="vista-cargando" class="vista activa" aria-live="polite">
            <p class="cargando"><i class="ti ti-loader-2 giro"></i> Confirmando tu correo...</p>
        </section>

        <section id="vista-exito" class="vista">
            <div class="icono-grande exito"><i class="ti ti-mail-check"></i></div>
            <h1>¡Correo confirmado!</h1>
            <p class="subtitulo">Tu cuenta ya está activa. Ahora puedes iniciar sesión en EntreLazados.</p>
            <a href="login.html" class="boton" id="btn-login"><i class="ti ti-login"></i> Iniciar sesión</a>
        </section>

        <section id="vista-error" class="vista">
            <div class="icono-grande error"><i class="ti ti-mail-x"></i></div>
            <h1>El enlace no sirve</h1>
            <p class="subtitulo" id="texto-error">El enlace no es válido o ya venció (dura 24 horas). Pide uno nuevo con el correo con el que te registraste.</p>
            <div id="mensaje-reenvio" class="mensaje" role="status"></div>
            <form id="form-reenviar" novalidate>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" autocomplete="email" inputmode="email" placeholder="usuario@gmail.com" required>
                <button type="submit" class="boton" id="btn-reenviar"><i class="ti ti-mail-forward"></i> Enviarme un enlace nuevo</button>
            </form>
            <div class="enlaces"><a href="login.html"><i class="ti ti-arrow-left"></i> Volver a iniciar sesión</a></div>
        </section>
    </main>

    <script>
        const REGEX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

        function mostrar(vista) {
            document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === vista));
        }

        async function confirmar() {
            const token = new URLSearchParams(window.location.search).get('token') || '';
            if (!/^[a-f0-9]{64}$/i.test(token)) return mostrar('vista-error');
            try {
                const res = await fetch('/api/verificar-correo?token=' + encodeURIComponent(token));
                const datos = await res.json().catch(() => ({}));
                if (res.ok && datos.ok) {
                    // El enlace ya se usó: se quita de la barra de direcciones
                    history.replaceState(null, '', 'verificar.html');
                    return mostrar('vista-exito');
                }
                if (datos.message) document.getElementById('texto-error').textContent = datos.message;
            } catch (e) {
                document.getElementById('texto-error').textContent = 'No se pudo conectar con el servidor. Intenta de nuevo en unos minutos.';
            }
            mostrar('vista-error');
        }

        document.getElementById('form-reenviar').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const correo = document.getElementById('correo').value.trim();
            const aviso = document.getElementById('mensaje-reenvio');
            const boton = document.getElementById('btn-reenviar');
            if (!REGEX_EMAIL.test(correo)) {
                aviso.className = 'mensaje error';
                aviso.textContent = 'Escribe un correo válido con su dominio completo (ejemplo: usuario@gmail.com).';
                return;
            }
            boton.disabled = true;
            try {
                const res = await fetch('/api/reenviar-verificacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: correo })
                });
                const datos = await res.json().catch(() => ({}));
                aviso.className = res.ok ? 'mensaje exito' : 'mensaje error';
                aviso.textContent = datos.message || (res.ok ? 'Listo. Revisa tu correo.' : 'No se pudo enviar el enlace.');
            } catch (e) {
                aviso.className = 'mensaje error';
                aviso.textContent = 'No se pudo conectar con el servidor.';
            } finally {
                boton.disabled = false;
            }
        });

        confirmar();
    </script>
</body>
</html>
