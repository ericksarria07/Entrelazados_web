<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - EntreLazados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-principal: #7D381B;
            --color-secundario: #3D170A;
            --color-terciario: #993D24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: #f5efe9 url('patron.jpeg') center / cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .tarjeta {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 8px;
            border-top: 4px solid var(--color-terciario);
            box-shadow: 0 8px 24px rgba(61, 23, 10, 0.18);
        }

        .tarjeta img { display: block; height: 56px; margin: 0 auto 16px; }

        h1 { font-size: 22px; color: var(--color-secundario); text-align: center; margin-bottom: 6px; }

        .subtitulo { font-size: 14px; color: #6b5b53; text-align: center; margin-bottom: 22px; }

        label { display: block; font-size: 14px; font-weight: 600; color: var(--color-secundario); margin-bottom: 6px; }

        input {
            width: 100%;
            padding: 11px 12px;
            font: inherit;
            border: 1px solid #d6c7bd;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        input:focus { outline: 2px solid var(--color-principal); border-color: transparent; }

        button {
            width: 100%;
            padding: 12px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: var(--color-principal);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover { background: var(--color-secundario); }
        button:disabled { opacity: 0.6; cursor: wait; }

        .mensaje { display: none; font-size: 14px; padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; }
        .mensaje.error { display: block; background: #fdecea; color: #a12a1a; }
        .mensaje.exito { display: block; background: #e8f5e9; color: #1e6b2a; }

        .volver { display: block; text-align: center; margin-top: 18px; font-size: 14px; color: var(--color-principal); }
    </style>
</head>
<body>
    <main class="tarjeta">
        <img src="logo.png" alt="EntreLazados">
        <h1>Restablecer contraseña</h1>
        <p class="subtitulo">Escribe tu nueva contraseña para volver a entrar a EntreLazados.</p>

        <div id="mensaje" class="mensaje" role="alert"></div>

        <form id="formRestablecer">
            <label for="nuevaPass">Nueva contraseña</label>
            <input type="password" id="nuevaPass" minlength="6" autocomplete="new-password" required>

            <label for="confirmarPass">Confirmar contraseña</label>
            <input type="password" id="confirmarPass" minlength="6" autocomplete="new-password" required>

            <button type="submit" id="btnEnviar">Actualizar contraseña</button>
        </form>

        <a class="volver" href="login.html">Volver a iniciar sesión</a>
    </main>

    <script>
        const API_URL = window.location.origin;
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('formRestablecer');
        const caja = document.getElementById('mensaje');
        const boton = document.getElementById('btnEnviar');

        function mostrar(texto, tipo) {
            caja.textContent = texto;
            caja.className = 'mensaje ' + tipo;
        }

        if (!token) {
            mostrar('El enlace no es válido o está incompleto. Solicita un nuevo enlace de recuperación desde la página de inicio de sesión.', 'error');
            form.querySelectorAll('input, button').forEach(el => el.disabled = true);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevaContrasena = document.getElementById('nuevaPass').value;
            const confirmar = document.getElementById('confirmarPass').value;

            if (nuevaContrasena.length < 6) return mostrar('La contraseña debe tener al menos 6 caracteres.', 'error');
            if (nuevaContrasena !== confirmar) return mostrar('Las contraseñas no coinciden.', 'error');

            boton.disabled = true;
            boton.textContent = 'Actualizando...';

            try {
                const res = await fetch(`${API_URL}/api/restablecer-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, nuevaContrasena })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrar(data.message + ' Te llevaremos al inicio de sesión...', 'exito');
                    setTimeout(() => window.location.href = 'login.html', 2500);
                } else {
                    mostrar(data.message || 'No se pudo restablecer la contraseña.', 'error');
                    boton.disabled = false;
                    boton.textContent = 'Actualizar contraseña';
                }
            } catch (error) {
                mostrar('Error de conexión al intentar restablecer la contraseña.', 'error');
                boton.disabled = false;
                boton.textContent = 'Actualizar contraseña';
            }
        });
    </script>
</body>
</html>
