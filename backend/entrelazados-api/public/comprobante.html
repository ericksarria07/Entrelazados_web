<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="sesion.js"></script>
    <script src="tema.js"></script>
    <title>Comprobante de trato - EntreLazados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        // Sin sesión no hay comprobante: al login
        (function () { try { if (!localStorage.getItem('token')) window.location.href = 'login.html'; } catch (e) { } })();
    </script>
    <!--
        COMPROBANTE DE UN TRATO
        comprobante.html?trato=ID muestra el resumen del trato (folio, partes, monto en número y
        en letras) para imprimirlo o guardarlo como PDF con la impresión del navegador.
        Los datos salen de GET /api/tratos/:id/comprobante (solo las dos partes y el administrador).
        No es una factura fiscal.
    -->
    <style>
        :root {
            --color-principal: #7D381B;
            --color-secundario: #3D170A;
            --color-terciario: #993D24;
            --papel: #ffffff;
            --tinta: #1a1a1a;
            --tinta-suave: #5f5f5f;
            --linea: #e0d8ce;
            --fondo: #ece6dc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--fondo); color: var(--tinta); font-family: 'Source Sans 3', 'Segoe UI', sans-serif; min-height: 100vh; padding: 24px 16px 48px; }
        .barra { max-width: 820px; margin: 0 auto 16px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .barra a, .barra button {
            display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px;
            text-decoration: none; cursor: pointer; border: 1px solid var(--linea); background: var(--papel); color: var(--color-secundario);
        }
        .barra button.principal { background: var(--color-principal); color: #fff; border-color: var(--color-principal); }
        .barra button.principal:hover { background: var(--color-terciario); }
        .hoja {
            position: relative; overflow: hidden; max-width: 820px; margin: 0 auto; background: var(--papel); color: var(--tinta);
            border-radius: 8px; box-shadow: 0 10px 30px rgba(61, 23, 10, 0.15); padding: 40px 44px;
        }
        .cabecera { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 3px solid var(--color-principal); padding-bottom: 20px; }
        .marca { display: flex; gap: 12px; align-items: center; }
        .marca img { width: 54px; height: 54px; object-fit: contain; }
        .marca strong { display: block; font-size: 24px; font-weight: 900; color: var(--color-secundario); letter-spacing: -0.5px; }
        .marca strong span { color: var(--color-terciario); }
        .marca small { color: var(--tinta-suave); font-size: 12px; }
        .folio { text-align: right; }
        .folio h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--tinta-suave); font-weight: 700; }
        .folio .numero { font-size: 26px; font-weight: 900; color: var(--color-secundario); font-variant-numeric: tabular-nums; }
        .folio .fecha { font-size: 12px; color: var(--tinta-suave); }
        .estado { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .estado.Completado { background: #e6f4ea; color: #1e6b34; }
        .estado.EnProceso { background: #e7f0fd; color: #1c4f9c; }
        .estado.Pendiente { background: #fff4d6; color: #7a5300; }
        .estado.Cancelado { background: #fde7e7; color: #a61e1e; }
        .partes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 26px 0; }
        .parte { border: 1px solid var(--linea); border-radius: 6px; padding: 14px 16px; }
        .parte h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--color-terciario); margin-bottom: 6px; }
        .parte .nombre { font-size: 17px; font-weight: 800; color: var(--color-secundario); }
        .parte dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin-top: 8px; font-size: 13px; }
        .parte dt { color: var(--tinta-suave); }
        .parte dd { overflow-wrap: anywhere; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--tinta-suave); border-bottom: 2px solid var(--linea); padding: 8px 6px; }
        td { padding: 10px 6px; border-bottom: 1px solid var(--linea); vertical-align: top; }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        td small { display: block; color: var(--tinta-suave); font-size: 12px; margin-top: 2px; }
        .total { display: flex; justify-content: flex-end; margin-top: 14px; }
        .total div { min-width: 280px; background: #f8f4ee; border-radius: 6px; padding: 14px 18px; }
        .total .fila { display: flex; justify-content: space-between; font-size: 14px; }
        .total .fila.grande { font-size: 22px; font-weight: 900; color: var(--color-secundario); margin-top: 4px; }
        .letras { margin-top: 10px; font-size: 13px; color: var(--tinta-suave); text-align: right; font-style: italic; }
        .nota { margin-top: 26px; padding-top: 14px; border-top: 1px dashed var(--linea); font-size: 12px; color: var(--tinta-suave); line-height: 1.5; }
        .aviso-estado { margin-top: 18px; padding: 10px 14px; border-radius: 6px; font-size: 13px; background: #fff4d6; color: #5c3d00; }
        .sello {
            position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg); pointer-events: none;
            font-size: 110px; font-weight: 900; letter-spacing: 8px; color: rgba(166, 30, 30, 0.12); border: 10px solid rgba(166, 30, 30, 0.12); padding: 0 30px; border-radius: 12px;
        }
        .mensaje { max-width: 820px; margin: 60px auto; text-align: center; background: var(--papel); border-radius: 8px; padding: 40px 20px; color: var(--tinta); }
        .mensaje i { font-size: 40px; color: var(--color-terciario); }
        .mensaje p { margin-top: 10px; }
        a:focus-visible, button:focus-visible { outline: 3px solid #f59f00; outline-offset: 2px; }
        @media (max-width: 640px) {
            .hoja { padding: 24px 18px; }
            .cabecera { flex-direction: column; }
            .folio { text-align: left; }
            .partes { grid-template-columns: 1fr; }
            .total div { min-width: 0; width: 100%; }
            .sello { font-size: 64px; }
        }
        /* Al imprimir o guardar como PDF: solo la hoja, en blanco, sin sombras ni botones */
        @media print {
            @page { size: A4; margin: 14mm; }
            html, body { background: #fff !important; padding: 0; }
            .barra, .tema-boton, .saltar-contenido, .aviso-notif, .panel-notif { display: none !important; }
            .hoja { box-shadow: none; border-radius: 0; padding: 0; max-width: none; }
            .parte, .total div { break-inside: avoid; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        /* Modo oscuro: alrededor oscuro, pero la hoja sigue siendo papel blanco */
        html[data-tema="oscuro"] body { background: #17110e; }
        html[data-tema="oscuro"] .barra a, html[data-tema="oscuro"] .barra button:not(.principal) { background: #2a201b; color: #f1e8e3; border-color: #4a3a31; }
    </style>
</head>
<body>
    <div class="barra">
        <a href="dashboard.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> Volver al dashboard</a>
        <button type="button" class="principal" id="btnImprimir" onclick="window.print()" disabled>
            <i class="ti ti-file-type-pdf" aria-hidden="true"></i> Guardar como PDF o imprimir
        </button>
    </div>
    <main id="contenido" aria-live="polite">
        <div class="mensaje"><p>Cargando comprobante…</p></div>
    </main>

    <script>
        // ---------------------------------------------------------------- MONTO EN LETRAS
        // 1350.5 -> "Mil trescientos cincuenta córdobas con 50/100"
        const UNIDADES = ['', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece',
            'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés',
            'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
        const DECENAS = ['', '', '', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];
        const CENTENAS = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];

        function menorDeMil(n) {
            if (n === 0) return '';
            if (n === 100) return 'cien';
            const c = Math.floor(n / 100), resto = n % 100;
            let texto = CENTENAS[c];
            if (resto) {
                const decenas = resto < 30 ? UNIDADES[resto] : DECENAS[Math.floor(resto / 10)] + (resto % 10 ? ' y ' + UNIDADES[resto % 10] : '');
                texto += (texto ? ' ' : '') + decenas;
            }
            return texto;
        }

        function enLetras(numero) {
            const entero = Math.floor(numero);
            const centavos = Math.round((numero - entero) * 100);
            const millones = Math.floor(entero / 1e6), miles = Math.floor((entero % 1e6) / 1000), resto = entero % 1000;
            const partes = [];
            if (millones) partes.push(millones === 1 ? 'un millón' : menorDeMil(millones).replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un') + ' millones');
            if (miles) partes.push(miles === 1 ? 'mil' : menorDeMil(miles).replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un') + ' mil');
            if (resto) partes.push(menorDeMil(resto));
            let texto = partes.join(' ') || 'cero';
            texto = texto.charAt(0).toUpperCase() + texto.slice(1);
            return `${texto} córdoba${entero === 1 ? '' : 's'} con ${String(centavos).padStart(2, '0')}/100`;
        }

        // ---------------------------------------------------------------- AYUDAS
        const dinero = (n) => 'C$ ' + Number(n).toLocaleString('es-NI', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fecha = (f, conHora = false) => f ? new Date(f).toLocaleString('es-NI', conHora
            ? { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }
            : { day: '2-digit', month: 'long', year: 'numeric' }) : '—';
        const ESTADOS = { Pendiente: 'Pendiente', EnProceso: 'En proceso', Completado: 'Completado', Cancelado: 'Anulado' };
        const ICONOS = { Pendiente: 'ti-hourglass', EnProceso: 'ti-truck-delivery', Completado: 'ti-circle-check', Cancelado: 'ti-circle-x' };

        function datoSi(etiqueta, valor) {
            return valor ? `<dt>${etiqueta}</dt><dd>${esc(valor)}</dd>` : '';
        }

        function tarjetaParte(titulo, p) {
            return `
                <section class="parte" aria-label="${titulo}">
                    <h2>${titulo}</h2>
                    <div class="nombre">${esc(p.nombre)}</div>
                    <dl>
                        ${datoSi(p.rol === 'Proveedor' ? 'Comercio' : 'Marca', p.nombreComercial)}
                        ${datoSi('RUC', p.ruc)}
                        ${datoSi('Correo', p.correo)}
                        ${datoSi('Teléfono', p.telefono)}
                        ${datoSi('Departamento', p.departamento)}
                        ${datoSi('Dirección', p.direccion)}
                    </dl>
                </section>`;
        }

        function mostrarMensaje(icono, texto) {
            document.getElementById('contenido').innerHTML = `<div class="mensaje"><i class="ti ${icono}" aria-hidden="true"></i><p>${esc(texto)}</p></div>`;
        }

        // ---------------------------------------------------------------- CARGA
        async function cargarComprobante() {
            const id = parseInt(new URLSearchParams(window.location.search).get('trato'), 10);
            if (!(id > 0)) return mostrarMensaje('ti-file-off', 'Falta el número del trato en la dirección.');
            try {
                const res = await fetch(`/api/tratos/${id}/comprobante`);
                const c = await res.json().catch(() => ({}));
                if (!res.ok) return mostrarMensaje('ti-file-off', c.message || 'No se pudo cargar el comprobante.');
                pintar(c);
            } catch (e) {
                mostrarMensaje('ti-wifi-off', 'No se pudo conectar con el servidor.');
            }
        }

        function pintar(c) {
            document.title = `Comprobante ${c.folio} - EntreLazados`;
            const s = c.subasta;
            const detalle = s
                ? `<small>Subasta #${Number(s.id)}${s.categoria ? ' · ' + esc(s.categoria) : ''} · ${Number(s.pujas)} puja${s.pujas === 1 ? '' : 's'} · cerró el ${esc(fecha(s.cierre, true))}</small>`
                : `<small>Origen: ${esc(c.origen)}</small>`;
            const avisos = {
                Pendiente: 'Trato pendiente: el pago y la entrega todavía no se han confirmado.',
                EnProceso: 'Trato en proceso: las partes ya acordaron el pago y la entrega, pero aún no se marca como completado.',
                Cancelado: 'Este trato fue cancelado: el comprobante queda anulado.'
            };
            document.getElementById('contenido').innerHTML = `
                <article class="hoja" aria-label="Comprobante ${esc(c.folio)}">
                    ${c.estado === 'Cancelado' ? '<div class="sello" aria-hidden="true">ANULADO</div>' : ''}
                    <header class="cabecera">
                        <div class="marca">
                            <img src="logo.png" alt="">
                            <div><strong>Entre<span>Lazados</span></strong><small>Mercado de materia prima para calzado y marroquinería · Nicaragua</small></div>
                        </div>
                        <div class="folio">
                            <h1>Comprobante de trato</h1>
                            <div class="numero">${esc(c.folio)}</div>
                            <div class="fecha">Cierre del trato: ${esc(fecha(c.fechaCierre, true))}</div>
                            <span class="estado ${esc(c.estado)}"><i class="ti ${ICONOS[c.estado] || 'ti-info-circle'}" aria-hidden="true"></i> ${esc(ESTADOS[c.estado] || c.estado)}</span>
                        </div>
                    </header>

                    <div class="partes">
                        ${tarjetaParte('Vende (proveedor)', c.proveedor)}
                        ${tarjetaParte('Compra (emprendedor)', c.comprador)}
                    </div>

                    <table>
                        <thead><tr><th scope="col">Concepto</th><th scope="col" class="num">Precio base</th><th scope="col" class="num">Monto acordado</th></tr></thead>
                        <tbody>
                            <tr>
                                <td><strong>${esc(c.concepto)}</strong>${detalle}</td>
                                <td class="num">${s ? dinero(s.precioBase) : '—'}</td>
                                <td class="num">${dinero(c.monto)}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="total"><div>
                        <div class="fila"><span>Subtotal</span><span>${dinero(c.monto)}</span></div>
                        <div class="fila grande"><span>Total</span><span>${dinero(c.monto)}</span></div>
                    </div></div>
                    <p class="letras">Son: ${esc(enLetras(c.monto))}</p>

                    ${avisos[c.estado] ? `<p class="aviso-estado">${avisos[c.estado]}</p>` : ''}

                    <p class="nota">
                        Este comprobante resume un acuerdo entre las partes registrado en EntreLazados. <strong>No es una factura fiscal</strong>:
                        si necesitas una factura válida ante la DGI, solicítala directamente al proveedor.
                        Emitido el ${esc(fecha(c.emitido, true))} · Trato #${Number(c.tratoId)}.
                    </p>
                </article>`;
            document.getElementById('btnImprimir').disabled = false;
        }

        document.addEventListener('DOMContentLoaded', cargarComprobante);
    </script>
</body>
</html>
