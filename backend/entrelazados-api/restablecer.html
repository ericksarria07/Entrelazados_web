<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - EntreLazados</title>
</head>
<body>
    <h2>Ingresa tu nueva contraseña</h2>
    <form id="formRestablecer">
        <input type="password" id="nuevaPass" placeholder="Nueva Contraseña" required>
        <button type="submit">Actualizar Contraseña</button>
    </form>

    <script>
        const API_URL = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('formRestablecer').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevaContrasena = document.getElementById('nuevaPass').value;

            try {
                const res = await fetch(`${API_URL}/api/restablecer-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, nuevaContrasena })
                });

                const data = await res.json();
                alert(data.message);
                if (res.ok) window.location.href = 'login.html';
            } catch (error) {
                alert("Error de conexión al intentar restablecer la contraseña.");
            }
        });
    </script>
</body>
</html>
