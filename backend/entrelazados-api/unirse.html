<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EntreLazados - Registro</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,900;1,6..12,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-principal: #7D381B;  /* Marrón Cálido */
            --color-secundario: #3D170A; /* Marrón Oscuro / Chocolate */
            --color-terciario: #993D24;  /* Terracota / Ámbar Rojizo */

            --font-principal: 'Arial Rounded MT Pro', 'Arial Rounded MT Bold', 'Source Sans 3', sans-serif;
            --font-secundaria: 'Leelawadee', 'Source Sans 3', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('textura.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f4f1ea;
            color: #1a1a1a;
            font-family: var(--font-secundaria);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .login-header {
            background-color: var(--color-secundario);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-family: var(--font-principal);
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--color-terciario);
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            background: rgba(255, 255, 255,0.85);
            width: 100%;
            max-width: 520px;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(61, 23, 10, 0.1);
            border-top: 5px solid var(--color-principal);
            text-align: center;
        }

        .register-logo {
            max-width: 110px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
        }

        .register-card h2 {
            font-family: var(--font-principal);
            font-size: 24px;
            color: var(--color-secundario);
            margin-bottom: 6px;
        }

        .register-card p.subtitle {
            font-size: 15px;
            color: var(--color-secundario);
            margin-bottom: 20px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .role-option {
            background-color: #f8f6f2;
            border: 2px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--color-secundario);
        }

        .role-option i {
            font-size: 24px;
            color: var(--color-principal);
        }

        .role-option .role-name {
            font-size: 13px;
            font-weight: 700;
        }

        .role-option.selected {
            border-color: var(--color-principal);
            background-color: rgba(125, 56, 27, 0.08);
        }

        .role-option.selected i {
            color: var(--color-terciario);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-secundario);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--color-principal);
            font-size: 18px;
        }

        .form-control {
            width: 100%;
            padding: 11px 12px 11px 40px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            font-family: var(--font-secundaria);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea.form-control {
            padding-top: 10px;
            resize: vertical;
            min-height: 80px;
        }

        .form-control:focus {
            border-color: var(--color-principal);
            box-shadow: 0 0 0 3px rgba(125, 56, 27, 0.15);
        }

        .dynamic-section {
            border-top: 1px dashed #ddd;
            padding-top: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .dynamic-section h3 {
            font-size: 14px;
            color: var(--color-terciario);
            text-align: left;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--color-principal);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font-secundaria);
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--color-terciario);
        }

        .divider {
            text-align: center;
            margin: 25px 0 15px 0;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255,0);
            z-index: 1;
        }

        .divider span {
            background-color: rgba(255, 255, 255,0);
            padding: 0 10px;
            font-size: 14px;
            color: var(--color-secundario);
            position: relative;
            z-index: 2;
        }

        .register-link {
            color: var(--color-principal);
            font-weight: 700;
            text-decoration: none;
        }

        .register-link:hover {
            color: var(--color-terciario);
            text-decoration: underline;
        }

        footer {
            background-color: var(--color-secundario);
            color: #d1c2b8;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            border-top: 3px solid var(--color-principal);
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            margin: 0 8px;
        }

        footer a:hover {
            color: var(--color-terciario);
        }
    </style>
</head>
<body>

    <header class="login-header">
        <a href="preview.html" class="logo">Entre<span>Lazados</span></a>
    </header>

    <main class="main-container">
        <div class="register-card">
            <img src="logo.png" alt="Logo EntreLazados" class="register-logo" onerror="this.style.display='none'">

            <h2>Crear Cuenta</h2>
            <p class="subtitle">Elige tu perfil y completa el formulario para comenzar</p>

            <div class="role-selector">
                <div class="role-option selected" id="optProveedor" onclick="selectRole('Proveedor')">
                    <i class="ti ti-truck-delivery"></i>
                    <div class="role-name">Proveedor</div>
                </div>
                <div class="role-option" id="optEmprendedor" onclick="selectRole('Emprendedor')">
                    <i class="ti ti-shoe"></i>
                    <div class="role-name">Emprendedor</div>
                </div>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault(); enviarDatos();">
                <div class="form-group">
                    <label for="nombreNegocio">Nombre o Razón Social</label>
                    <div class="input-wrapper">
                        <i class="ti ti-building-store"></i>
                        <input type="text" id="nombreNegocio" class="form-control" placeholder="Ej. Taller Jiménez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="ti ti-mail"></i>
                        <input 
                            type="email" 
                            id="correo" 
                            class="form-control" 
                            placeholder="contacto@taller.com" 
                            pattern="^[^\s@]+@[^\s@]+\.[^\s@]{2,}$"
                            title="Ingresa un correo electrónico válido con su dominio completo (ejemplo: usuario@gmail.com)"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono WhatsApp</label>
                    <div class="input-wrapper">
                        <i class="ti ti-brand-whatsapp"></i>
                        <input type="text" id="telefono" class="form-control" placeholder="Ej. +505 8888-8888" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="deptoId">Departamento</label>
                    <div class="input-wrapper">
                        <i class="ti ti-map-pin"></i>
                        <input type="text" id="deptoId" class="form-control" placeholder="Ej. Managua, Masaya, León..." required>
                    </div>
                </div>

                <div id="seccionProveedor" class="dynamic-section">
                    <h3><i class="ti ti-box"></i> Datos del Proveedor</h3>
                    
                    <div class="form-group">
                        <label for="numeroRuc">Número RUC</label>
                        <div class="input-wrapper">
                            <i class="ti ti-id"></i>
                            <input type="text" id="numeroRuc" class="form-control" placeholder="Ej. J0310000000000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nombreComercial">Nombre Comercial</label>
                        <div class="input-wrapper">
                            <i class="ti ti-briefcase"></i>
                            <input type="text" id="nombreComercial" class="form-control" placeholder="Ej. Cueros e Insumos Nicaragua">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tipoMateriaPrimaPrincipal">Materia Prima Principal</label>
                        <div class="input-wrapper">
                            <i class="ti ti-packages"></i>
                            <input type="text" id="tipoMateriaPrimaPrincipal" class="form-control" placeholder="Ej. Cuero vacuno, Suelas, Sillas, Herrajes">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descripcionEmpresa">Descripción de la Empresa</label>
                        <div class="input-wrapper">
                            <i class="ti ti-notes"></i>
                            <textarea id="descripcionEmpresa" class="form-control" placeholder="Breve descripción de los insumos o servicios que ofreces..."></textarea>
                        </div>
                    </div>
                </div>

                <div id="seccionEmprendedor" class="dynamic-section" style="display: none;">
                    <h3><i class="ti ti-cut"></i> Datos del Emprendedor</h3>

                    <div class="form-group">
                        <label for="nombreMarca">Nombre de la Marca</label>
                        <div class="input-wrapper">
                            <i class="ti ti-tag"></i>
                            <input type="text" id="nombreMarca" class="form-control" placeholder="Ej. Calzados Artesanales M&R">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="especialidadCalzado">Especialidad en Calzado</label>
                        <div class="input-wrapper">
                            <i class="ti ti-shoe"></i>
                            <input type="text" id="especialidadCalzado" class="form-control" placeholder="Ej. Botas de cuero, Sandalias, Calzado formal">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="capacidadProduccionMensual">Capacidad de Producción Mensual (Pares)</label>
                        <div class="input-wrapper">
                            <i class="ti ti-report-analytics"></i>
                            <input type="number" id="capacidadProduccionMensual" class="form-control" placeholder="Ej. 250">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Crear Contraseña</label>
                    <div class="input-wrapper">
                        <i class="ti ti-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <i class="ti ti-lock-check"></i>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="ti ti-user-plus"></i> Completar Registro
                </button>
            </form>

            <div class="divider">
                <span>¿Ya tienes cuenta?</span>
            </div>

            <p style="font-size: 13px;">
                <a href="login.html" class="register-link">Inicia sesión aquí</a>
            </p>
        </div>
    </main>

    <footer>
        <p>EntreLazados © 2026 - Mercado Digital de Materia Prima y Calzado</p>
        <p style="margin-top: 8px;">
            <a href="preview.html">Inicio</a> | 
            <a href="mercado.html">Mercado</a> | 
            <a href="login.html">Iniciar Sesión</a>
        </p>
    </footer>

    <script>
        const REGEX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        let selectedRol = 'Proveedor';

        function selectRole(rolValue) {
            selectedRol = rolValue;

            const optProv = document.getElementById('optProveedor');
            const optEmp = document.getElementById('optEmprendedor');
            const secProv = document.getElementById('seccionProveedor');
            const secEmp = document.getElementById('seccionEmprendedor');

            if (rolValue === 'Proveedor') {
                optProv.classList.add('selected');
                optEmp.classList.remove('selected');
                secProv.style.display = 'block';
                secEmp.style.display = 'none';
            } else {
                optEmp.classList.add('selected');
                optProv.classList.remove('selected');
                secProv.style.display = 'none';
                secEmp.style.display = 'block';
            }
        }

        async function enviarDatos() {
            const nombreVal = document.getElementById('nombreNegocio').value.trim();
            const emailVal = document.getElementById('correo').value.trim();
            const telefonoVal = document.getElementById('telefono').value.trim();
            const deptoIdVal = document.getElementById('deptoId').value.trim();
            const passVal = document.getElementById('password').value;
            const confirmPassVal = document.getElementById('confirmPassword').value;

            if (!nombreVal || !emailVal || !telefonoVal || !deptoIdVal || !passVal || !confirmPassVal) {
                alert("Por favor, rellena todos los campos obligatorios antes de continuar.");
                return;
            }

            if (!REGEX_EMAIL.test(emailVal)) {
                alert("Por favor, ingresa un correo electrónico válido con su dominio completo (ejemplo: usuario@gmail.com).");
                return;
            }

            if (passVal !== confirmPassVal) {
                alert("Las contraseñas no coinciden. Por favor verifícalas.");
                return;
            }

            const data = {
                nombre: nombreVal,
                rol: selectedRol,
                email: emailVal,
                telefono: telefonoVal,
                deptoId: deptoIdVal,
                password: passVal,
                numeroRuc: document.getElementById('numeroRuc').value.trim(),
                nombreComercial: document.getElementById('nombreComercial').value.trim(),
                tipoMateriaPrimaPrincipal: document.getElementById('tipoMateriaPrimaPrincipal').value.trim(),
                descripcionEmpresa: document.getElementById('descripcionEmpresa').value.trim(),
                nombreMarca: document.getElementById('nombreMarca').value.trim(),
                especialidadCalzado: document.getElementById('especialidadCalzado').value.trim(),
                capacidadProduccionMensual: document.getElementById('capacidadProduccionMensual').value.trim()
            };

            const API_URL = window.location.origin;

            try {
                const response = await fetch(`${API_URL}/registro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resultado = await response.json();

                if (response.ok) {
                    alert("¡Éxito! " + (resultado.message || "Registro completado exitosamente."));
                    window.location.href = 'login.html';
                } else {
                    alert("Error del servidor: " + (resultado.message || "No se pudo registrar."));
                }

            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar al servidor. Asegúrate de que index.js esté corriendo.");
            }
        }
    </script>
</body>
</html>
